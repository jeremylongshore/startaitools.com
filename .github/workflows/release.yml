name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "major | minor | patch | auto"
        default: "auto"
        required: true
      dry_run:
        description: "Do everything except tag/release/publish"
        type: boolean
        default: false
  push:
    branches: [master]

permissions:
  contents: write
  issues: write
  discussions: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'jeremylongshore/startaitools.com' && github.event.repository.default_branch == 'master' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/scripts-lint.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    outputs:
      published: ${{ steps.publish.outputs.published }}
      release-sha: ${{ steps.publish.outputs.release-sha }}
      release-tag: ${{ steps.publish.outputs.release-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.1.0 — includes 2026-07-20 backport of allow-unsafe-pr-checkout
        with:
          fetch-depth: 0

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify release target
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = "jeremylongshore/startaitools.com" ]
          [ "$DEFAULT_BRANCH" = "master" ]
          [ "$GITHUB_REF" = "refs/heads/master" ]

      - name: Verify readiness
        run: |
          test -z "$(git status --porcelain)" || { echo "Uncommitted changes found"; exit 1; }
          if [ -f package.json ] && jq -e ".scripts.test" package.json >/dev/null 2>&1; then
            echo "Test script found, running tests..."
            npm ci
            npm test
          fi

      - name: Determine previous tag
        id: prev
        run: |
          # Use the HIGHEST EXISTING semver tag, NOT `git describe` (which only
          # considers tags reachable from HEAD). A prior release tag can point to
          # a "[skip ci]" version-bump commit that never landed on the branch
          # (protected-branch push rejected the bot) and so dangles; `git describe`
          # then keeps returning an older tag and the bump recomputes an
          # already-existing tag → `git tag` fails "already exists" (exit 128) on
          # every push. Highest-existing-tag makes the version monotonic
          # regardless of ancestry and permanently breaks that loop.
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          [ -z "$PREV_TAG" ] && PREV_TAG="v0.0.0"
          echo "prev=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Check if release needed
        id: check
        run: |
          set -euo pipefail
          PREV="${{ steps.prev.outputs.prev }}"
          if [ "$PREV" = "v0.0.0" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check if there are new commits since last tag
          NEW_COMMITS=$(git rev-list "$PREV..HEAD" --count)
          if [ "$NEW_COMMITS" -gt 0 ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Found $NEW_COMMITS new commits since $PREV"
          else
            # A previous atomic ref publication may have succeeded while the
            # GitHub API failed. Reconcile only that exact released master;
            # never reuse a dangling, lightweight or mismatched highest tag.
            [ "$GITHUB_REPOSITORY" = "jeremylongshore/startaitools.com" ]
            [ "$DEFAULT_BRANCH" = "master" ]
            [ "$GITHUB_REF" = "refs/heads/master" ]
            [[ "$PREV" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            REVISION=$(git rev-parse HEAD)
            [ "$(git cat-file -t "refs/tags/$PREV")" = "tag" ]
            ADOPTED=false
            CANDIDATE=$(git rev-parse "refs/tags/$PREV^{commit}")
            [ "$(git ls-remote origin refs/heads/master | cut -f1)" = "$CANDIDATE" ]
            if [ "$CANDIDATE" != "$REVISION" ]; then
              # Same-event reruns checkout the original triggering SHA. Adopt
              # only the exact two generated metadata commits; tested source,
              # executable modes and workflow blobs must otherwise be identical.
              [ "$REVISION" = "$GITHUB_SHA" ]
              git merge-base --is-ancestor "$REVISION" "$CANDIDATE"
              mapfile -t COMMITS < <(git rev-list --reverse "$REVISION..$CANDIDATE")
              [ "${#COMMITS[@]}" -eq 2 ]
              [ "$(git rev-list --parents -n1 "${COMMITS[0]}")" = "${COMMITS[0]} $REVISION" ]
              [ "$(git rev-list --parents -n1 "${COMMITS[1]}")" = "${COMMITS[1]} ${COMMITS[0]}" ]
              [ "${COMMITS[1]}" = "$CANDIDATE" ]
              BOT='github-actions[bot]|41898282+github-actions[bot]@users.noreply.github.com'
              for COMMIT in "${COMMITS[@]}"; do
                [ "$(git show -s --format='%an|%ae' "$COMMIT")" = "$BOT" ]
                [ "$(git show -s --format='%cn|%ce' "$COMMIT")" = "$BOT" ]
              done
              [ "$(git show -s --format=%B "${COMMITS[0]}")" = "chore: release $PREV [skip ci]" ]
              [ "$(git show -s --format=%B "$CANDIDATE")" = "docs: update changelog for $PREV [skip ci]" ]
              [ "$(git diff-tree --no-commit-id --name-only -r "${COMMITS[0]}")" = "version.txt" ]
              [ "$(git diff-tree --no-commit-id --name-only -r "$CANDIDATE")" = "CHANGELOG.md" ]
              for FILE in version.txt CHANGELOG.md; do
                [ "$(git ls-tree "$REVISION" -- "$FILE" | cut -d' ' -f1)" = "100644" ]
                [ "$(git ls-tree "$CANDIDATE" -- "$FILE" | cut -d' ' -f1)" = "100644" ]
              done
              git diff --quiet "$REVISION" "$CANDIDATE" -- . ':!version.txt' ':!CHANGELOG.md'
              git diff --quiet
              git diff --cached --quiet
              # Recheck transport identity immediately before this local-only
              # detached adoption; no branch, tag or owner checkout is rewritten.
              [ "$(git ls-remote origin refs/heads/master | cut -f1)" = "$CANDIDATE" ]
              [ "$(git ls-remote origin "refs/tags/$PREV" | cut -f1)" = "$(git rev-parse "refs/tags/$PREV")" ]
              git checkout --detach "$CANDIDATE"
              REVISION=$CANDIDATE
              ADOPTED=true
            fi
            git show HEAD:version.txt | cmp - <(printf '%s\n' "${PREV#v}")
            [ "$(git show HEAD:CHANGELOG.md | sed -n '1p')" = "# Release $PREV" ]
            [ "$(git ls-remote origin refs/heads/master | cut -f1)" = "$REVISION" ]
            TAG_OBJECT=$(git rev-parse "refs/tags/$PREV")
            [ "$(git ls-remote origin "refs/tags/$PREV" | cut -f1)" = "$TAG_OBJECT" ]
            umask 077
            RESPONSE=$(mktemp)
            trap 'rm -f "$RESPONSE"' EXIT
            API_RC=0
            gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$PREV" > "$RESPONSE" || API_RC=$?
            HTTP_STATUS=$(sed -nE '1s/^HTTP\/[0-9.]+ ([0-9]{3}).*/\1/p' "$RESPONSE")
            if [ "$API_RC" -eq 0 ] && [ "$HTTP_STATUS" = "200" ]; then
              sed '1,/^\r\{0,1\}$/d' "$RESPONSE" | jq -e --arg tag "$PREV" \
                '.tag_name == $tag and .draft == false and .prerelease == false and (.published_at | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))' > /dev/null
              echo "needed=false" >> "$GITHUB_OUTPUT"
              if [ "$ADOPTED" = true ]; then
                {
                  echo "resume=true"
                  echo "release-exists=true"
                } >> "$GITHUB_OUTPUT"
                echo "Verified original-trigger retry resumes the existing release handoff"
              else
                echo "Existing released master is complete; no deployment requested"
              fi
            elif [ "$API_RC" -ne 0 ] && [ "$HTTP_STATUS" = "404" ]; then
              sed '1,/^\r\{0,1\}$/d' "$RESPONSE" | jq -e '.message == "Not Found"' > /dev/null
              {
                echo "needed=false"
                echo "resume=true"
              } >> "$GITHUB_OUTPUT"
              echo "Exact released master lacks its GitHub Release; resuming that artifact only"
            else
              echo "GitHub Release lookup failed; HTTP category: ${HTTP_STATUS:-unavailable}" >&2
              exit 1
            fi
          fi

      - name: Prepare existing release notes
        if: steps.check.outputs.resume == 'true'
        id: resume
        run: |
          set -euo pipefail
          NOTES=$(mktemp)
          git show HEAD:CHANGELOG.md | sed '/^---$/,$d' > "$NOTES"
          test -s "$NOTES"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Decide bump
        if: steps.check.outputs.needed == 'true'
        id: bump
        run: |
          # shellcheck disable=SC2209  # GitHub Actions expression expansion reads as an unquoted command; intentional
          INPUT="${{ github.event.inputs.bump || '' }}"
          if [ "$INPUT" != "" ] && [ "$INPUT" != "auto" ]; then
            echo "type=$INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RANGE="${{ steps.prev.outputs.prev }}..HEAD"
          BRK=$(git log --pretty=%B "$RANGE" | grep -ciE "BREAKING CHANGE" || true)
          FEAT=$(git log --pretty=%s "$RANGE" | grep -ciE "^feat(\(|: )" || true)
          if [ "$BRK" -gt 0 ]; then T="major"
          elif [ "$FEAT" -gt 0 ]; then T="minor"
          else T="patch"
          fi
          echo "type=$T" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        if: steps.check.outputs.needed == 'true'
        id: ver
        run: |
          # shellcheck disable=SC2086  # GitHub expression expansion
          PREV="${{ steps.prev.outputs.prev }}"
          PREV="${PREV#v}"
          IFS=. read -r MA MI PA <<< "$PREV"
          case "${{ steps.bump.outputs.type }}" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
            *) echo "Invalid bump"; exit 1 ;;
          esac
          NEW="$MA.$MI.$PA"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"

      - name: Update version files
        if: steps.check.outputs.needed == 'true'
        run: |
          set -e
          NEW="${{ steps.ver.outputs.new }}"
          touched=0
          if [ -f package.json ]; then
            jq --arg v "$NEW" ".version=\$v" package.json > package.tmp && mv package.tmp package.json
            if [ -f package-lock.json ]; then npm i --package-lock-only >/dev/null 2>&1 || true; fi
            touched=1
          fi
          if [ -f version.txt ]; then echo "$NEW" > version.txt; touched=1; fi
          if [ "$touched" -eq 0 ]; then echo "$NEW" > version.txt; fi
          git add -A
          if git diff --staged --quiet; then
            echo "No content change"
          else
            git commit -m "chore: release v$NEW [skip ci]"
          fi

      - name: Generate changelog entry
        if: steps.check.outputs.needed == 'true'
        id: clog
        run: |
          set -e
          # shellcheck disable=SC2086  # GitHub expression expansion
          NEW="${{ steps.ver.outputs.new }}"
          PREV="${{ steps.prev.outputs.prev }}"
          DATE=$(date +%Y-%m-%d)
          NOTES=$(mktemp)
          {
            echo "# Release v$NEW"
            echo
            echo "**Release Date**: $DATE"
            echo
            echo "## Changes since $PREV"
            echo
            if [ "$PREV" = "v0.0.0" ]; then
              git log --pretty="- %s (%h)" HEAD
            else
              git log --pretty="- %s (%h)" "$PREV"..HEAD
            fi
          } > "$NOTES"
          if [ -f CHANGELOG.md ]; then
            tmp=$(mktemp)
            cat "$NOTES" > "$tmp"
            echo -e "\n---\n" >> "$tmp"
            cat CHANGELOG.md >> "$tmp"
            mv "$tmp" CHANGELOG.md
          else
            cp "$NOTES" CHANGELOG.md
          fi
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No changelog delta"
          else
            git commit -m "docs: update changelog for v$NEW [skip ci]"
          fi
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Verify committed release artifacts
        if: steps.check.outputs.needed == 'true'
        run: |
          set -euo pipefail
          NEW="${{ steps.ver.outputs.new }}"
          TAG="${{ steps.ver.outputs.tag }}"
          # A successful commit command does not prove hooks retained the outputs.
          # Verify the exact revision that the following step will tag, including
          # dry runs. version.txt is this Hugo repository's version authority.
          git diff --quiet || { echo "Uncommitted tracked release changes"; exit 1; }
          git diff --cached --quiet || { echo "Uncommitted staged release changes"; exit 1; }
          [ "$TAG" = "v$NEW" ] || { echo "Release tag/version mismatch"; exit 1; }
          git show HEAD:version.txt | cmp - <(printf '%s\n' "$NEW")
          HEADER=$(git show HEAD:CHANGELOG.md | sed -n '1p')
          [ "$HEADER" = "# Release v$NEW" ] || { echo "Committed changelog release header mismatch"; exit 1; }

      - name: Create tag and push
        if: steps.check.outputs.needed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          [ "$GITHUB_REPOSITORY" = "jeremylongshore/startaitools.com" ]
          [ "$DEFAULT_BRANCH" = "master" ]
          [ "$GITHUB_REF" = "refs/heads/master" ]
          # Never replace an existing tag or hide a refused branch update.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Release tag already exists; refusing a conflicting publication" >&2
            exit 1
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$TAG:refs/tags/$TAG"

      - name: Create GitHub Release
        id: publish
        if: (steps.check.outputs.needed == 'true' || steps.check.outputs.resume == 'true') && github.event.inputs.dry_run != 'true'
        env:
          RELEASE_EXISTS: ${{ steps.check.outputs.release-exists }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag || steps.prev.outputs.prev }}"
          RELEASE_SHA=$(git rev-parse HEAD)
          [ "$(git ls-remote origin refs/heads/master | cut -f1)" = "$RELEASE_SHA" ]
          [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$RELEASE_SHA" ]
          [ "$(git cat-file -t "refs/tags/$TAG")" = "tag" ]
          TAG_OBJECT=$(git rev-parse "refs/tags/$TAG")
          [ "$(git ls-remote origin "refs/tags/$TAG" | cut -f1)" = "$TAG_OBJECT" ]
          if [ "$RELEASE_EXISTS" != true ]; then
            gh release create "$TAG" --verify-tag --target "$RELEASE_SHA" \
              --title "$TAG" \
              --notes-file "${{ steps.clog.outputs.notes || steps.resume.outputs.notes }}"
          fi
          # Process success alone cannot attest an existing published artifact.
          # A failed read remains visible; a later exact retry reconciles it.
          umask 077
          RESPONSE=$(mktemp)
          trap 'rm -f "$RESPONSE"' EXIT
          gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RESPONSE"
          [ "$(sed -nE '1s/^HTTP\/[0-9.]+ ([0-9]{3}).*/\1/p' "$RESPONSE")" = "200" ]
          sed '1,/^\r\{0,1\}$/d' "$RESPONSE" | jq -e --arg tag "$TAG" \
            '.tag_name == $tag and .draft == false and .prerelease == false and (.published_at | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))' > /dev/null
          [ "$(git ls-remote origin refs/heads/master | cut -f1)" = "$RELEASE_SHA" ]
          [ "$(git ls-remote origin "refs/tags/$TAG" | cut -f1)" = "$TAG_OBJECT" ]
          # Deployment follows atomic refs plus a created/verified GitHub Release.
          # An original-trigger retry can resume an already accepted release;
          # dry runs and ordinary same-HEAD/no-change runs emit nothing.
          {
            echo "release-sha=$RELEASE_SHA"
            echo "release-tag=$TAG"
            echo "published=true"
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      release-sha: ${{ needs.release.outputs.release-sha }}
      release-tag: ${{ needs.release.outputs.release-tag }}
    secrets:
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
      VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
