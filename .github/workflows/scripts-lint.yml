name: scripts-lint

# Static analysis for blog pipeline scripts + Hugo build sanity. This is the
# safety net the 2026-05-25/26 silent cron timeout exposed: zero CI on the
# cron wrappers means a quoting / parameter-expansion / unused-import bug can
# ship straight to a 7am cron run with no gate. Triggers on every PR and on
# push to master (in case a hotfix lands directly).

on:
  workflow_call:
  pull_request:
  push:
    branches: [master]

jobs:
  shellcheck-blog-scripts:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 — includes 2026-07-20 backport of allow-unsafe-pr-checkout

      # ubuntu-latest SHIPS shellcheck preinstalled; apt is only a fallback.
      # The unconditional `apt-get update && install` hung twice on 2026-08-19
      # (mirror stall), pinning the job in_progress for 20+ minutes each time —
      # for a binary that was already on the runner. Timeout caps the fallback
      # so a mirror stall fails the step in 3 minutes instead of hanging the job.
      - name: Ensure shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            timeout 180 sudo apt-get update
            timeout 180 sudo apt-get install -y shellcheck
          fi
          shellcheck --version | head -2

      - name: shellcheck (cron + skill helpers + verify scripts)
        run: |
          shopt -s globstar nullglob
          files=(
            scripts/blog/*.sh
            .claude/skills/blog-*/scripts/*.sh
            verify_links.sh
            check_links.sh
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no .sh files found — skipping"
            exit 0
          fi
          shellcheck -S style "${files[@]}"

      - name: Publication-aware idempotency regression
        run: bash scripts/blog/test-pipeline-invariants.sh

      - name: Dual-publish transform regression
        # 16 cases over transform-hugo-to-astro, the step blog-land.sh uses to mirror a
        # post to tonsofskills. Existed since the transform shipped but NOTHING ran it
        # until 2026-09-19: an unexecuted test reads as coverage and provides none.
        run: bash .claude/skills/blog-backfill/scripts/test-transform-hugo-to-astro.sh

  ruff-blog-scripts:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 — includes 2026-07-20 backport of allow-unsafe-pr-checkout
        with:
          # Regression tests execute the exact historical buggy helper, not a mock.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.12'

      - name: Install ruff
        run: python3 -m pip install --quiet 'ruff==0.16.9'

      - name: ruff check (skill helpers + check-links)
        run: |
          shopt -s globstar nullglob
          # Glob, do not enumerate. This was an explicit allowlist until
          # 2026-08-06, so ingest-syndication-replies.py was added in PR #60
          # and merged twice under a green "ruff" check that had never opened
          # it; the file in fact carried 7 violations of this repo's own ruff
          # config. An allowlist silently excludes every new file, which is
          # the worst property a gate can have: reporting success for work it
          # did not inspect.
          files=(
            scripts/blog/*.py
            scripts/blog/blogpipe/*.py
            .claude/skills/blog-*/scripts/*.py
            tests/*.py
            check-links.py
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no .py files found — skipping"
            exit 0
          fi
          ruff check "${files[@]}"

      - name: Decide whether this push can change pipeline behaviour
        id: scope
        # The daily lander pushes one post + its methodology records + its image.
        # Release reuses this workflow as its gate, so every post used to wait on
        # the full ~15 min suite before deploy while blog-land.sh gives the page
        # 360s to go live: each good publish ended "public article unavailable;
        # delivery pending" (2026-09-18). Content cannot change pipeline code, so
        # a content-only push skips the suite. Fail-safe: a pull request, an
        # unknown base, a diff error or ANY other path runs it.
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          verdict=false
          if [ "$EVENT" = "push" ] && [ -n "${BEFORE:-}" ] \
              && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
              && changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA") \
              && [ -n "$changed" ]; then
            allowed='^(content/posts/[a-z0-9][a-z0-9-]*\.md|static/images/posts/.+|\.claude/skills/blog-backfill/methodology/(decisions|feedback)\.jsonl)$'
            if ! printf '%s\n' "$changed" | grep -Evq "$allowed"; then
              verdict=true
            fi
          fi
          echo "content_only=$verdict" >> "$GITHUB_OUTPUT"
          echo "content_only=$verdict"

      - name: Install pytest + Pillow (card renderer)
        if: steps.scope.outputs.content_only != 'true'
        run: python3 -m pip install --quiet 'pytest==9.1.1' Pillow

      - name: Blog pipeline tests
        if: steps.scope.outputs.content_only != 'true'
        # The live MiniMax smoke inside this module is env-gated and skips here:
        # BLOG_IMAGE_LIVE_SMOKE is unset, so CI stays offline and spends nothing.
        run: python3 -m pytest tests/ -q

      - name: Audit the 14-day catalog claim against tracked posts
        run: |
          python3 scripts/blog/catalog-audit.py \
            --start 2026-07-16 --end 2026-07-29 \
            --article content/posts/after-14-days-of-daily-posts-here-is-what-i-notice.md

  # Voice lint on changed posts only (hard no em/en dash + AI-slop phrases).
  # Full content/posts/ is NOT scanned: historical posts predate the ban and
  # are intentionally left alone. Daily produce→land also runs this gate.
  voice-lint-changed-posts:
    name: voice-lint (changed posts)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 — includes 2026-07-20 backport of allow-unsafe-pr-checkout
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.0.0
        with:
          python-version: '3.12'

      - name: Lint changed content/posts/*.md
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- 'content/posts/*.md' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no changed content/posts/*.md — skipping"
            exit 0
          fi
          python3 .claude/skills/blog-backfill/scripts/lint-post-voice.py "${files[@]}"

  hugo-build-check:
    name: hugo build (PR only)
    # The separate VPS deploy workflow builds pushes to master. PR checks
    # catch front-matter, shortcode and isolated pipeline regressions before merge.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 — includes 2026-07-20 backport of allow-unsafe-pr-checkout
        with:
          submodules: recursive

      - name: Install Hugo (extended, matches netlify.toml)
        run: |
          HUGO_VERSION=0.150.0
          curl -fsSL -o /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Build site (with future-dated posts, like netlify.toml)
        run: hugo --buildFuture --gc -d /tmp/hugo-verify

      - name: Two-day offline contract and quarantine replay
        run: |
          python3 scripts/blog/test-blog-contract-replay.py \
            --hugo "$(command -v hugo)" \
            --start-date 2030-12-20 \
            --output-root "${RUNNER_TEMP}/blog-offline-replay"
