name: Deploy startaitools.com to VPS

# Release publishes master and its annotated tag atomically before calling this
# workflow. The pinned central workflow still uses the established no-argument
# forced SSH command, which deploys default master; it has no SHA/ref input.
# Check the released refs before and after that call. A newer source merge on
# master supersedes this run (scripts/blog/release-supersede-check.sh): it skips
# or ends the deploy green and hands off to that merge's serialised Release run.
# Tag changes and rewritten history still fail consistency verification.
# Actual host revision/public bytes remain separate production verification.

on:
  workflow_call:
    inputs:
      release-sha:
        type: string
        required: true
      release-tag:
        type: string
        required: true
    secrets:
      TS_OIDC_CLIENT_ID:
        required: true
      TS_AUDIENCE:
        required: true
      VPS_DEPLOY_KEY:
        required: true
      VPS_HOST_KEY:
        required: true
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

# Separate from the calling Release group: sharing a group would deadlock the
# parent/callee and could replace an unrelated pending release.
concurrency:
  group: deploy-vps-${{ github.repository }}
  cancel-in-progress: false

jobs:
  test:
    if: github.repository == 'jeremylongshore/startaitools.com' && github.event.repository.default_branch == 'master' && github.ref == 'refs/heads/master'
    name: pre-deploy build gate
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.identity.outputs.deploy }}
      release-sha: ${{ steps.identity.outputs.release-sha }}
      release-tag: ${{ steps.identity.outputs.release-tag }}
      tag-object: ${{ steps.identity.outputs.tag-object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release-sha || 'master' }}
          submodules: recursive
          fetch-depth: 0
      - name: Verify released master before deployment
        id: identity
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.release-sha || '' }}
          EXPECTED_RELEASE_TAG: ${{ inputs.release-tag || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = "jeremylongshore/startaitools.com" ]
          [ "$DEFAULT_BRANCH" = "master" ]
          [ "$GITHUB_REF" = "refs/heads/master" ]
          if [ -z "$EXPECTED_RELEASE_SHA" ] || [ -z "$EXPECTED_RELEASE_TAG" ]; then
            [ -z "$EXPECTED_RELEASE_SHA$EXPECTED_RELEASE_TAG" ]
            [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]
          fi
          REVISION=$(git rev-parse HEAD)
          VERSION=$(git show HEAD:version.txt)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git show HEAD:version.txt | cmp - <(printf '%s\n' "$VERSION")
          TAG="v$VERSION"
          [ -z "$EXPECTED_RELEASE_SHA" ] || [ "$EXPECTED_RELEASE_SHA" = "$REVISION" ]
          [ -z "$EXPECTED_RELEASE_TAG" ] || [ "$EXPECTED_RELEASE_TAG" = "$TAG" ]
          [ "$(git cat-file -t "refs/tags/$TAG")" = "tag" ]
          [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$REVISION" ]
          HEADER=$(git show HEAD:CHANGELOG.md | sed -n '1p')
          [ "$HEADER" = "# Release $TAG" ]
          TAG_OBJECT=$(git rev-parse "refs/tags/$TAG")
          # A newer merge may reach master after this release was pushed. The
          # forced SSH command deploys the master tip, so this run must not
          # deploy it under the older tag: it hands off to that merge's own
          # (serialised) Release run and stays green. A manual dispatch deploys
          # only the exact tip; rewritten history always fails.
          DEPLOY=true
          CLASS=$(scripts/blog/release-supersede-check.sh "$REVISION")
          case "$(printf '%s\n' "$CLASS" | sed -n 's/^state=//p')" in
            current) ;;
            superseded)
              [ -n "$EXPECTED_RELEASE_SHA" ]
              NEWER=$(printf '%s\n' "$CLASS" | sed -n 's/^newer=//p')
              echo "::notice title=Deploy superseded::master advanced to $NEWER after $TAG; that commit's Release run deploys both."
              DEPLOY=false
              ;;
            *) echo "master is not the released commit or a newer source commit" >&2; exit 1 ;;
          esac
          [ "$(git ls-remote origin "refs/tags/$TAG" | cut -f1)" = "$TAG_OBJECT" ]
          {
            echo "deploy=$DEPLOY"
            echo "release-sha=$REVISION"
            echo "release-tag=$TAG"
            echo "tag-object=$TAG_OBJECT"
          } >> "$GITHUB_OUTPUT"
      - name: Install Hugo (extended, same 0.150.0 pin as the VPS build)
        run: |
          HUGO_VERSION=0.150.0
          curl -fsSL -o /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
          hugo version
      - name: Build (validate production build before VPS push)
        run: hugo --buildFuture --gc --minify --cleanDestinationDir

  deploy:
    needs: test
    if: needs.test.outputs.deploy == 'true'
    uses: jeremylongshore/.github/.github/workflows/vps-deploy.yml@53d6be37d6c046818157b954acb33667ac095dd8
    with:
      variant: static
      srv-path: /srv/startaitools
      health-check-url: https://startaitools.com/healthz
      vps-tailnet-ip: 100.88.144.55
      vps-public-ip: 167.86.106.29
      vps-host: intentsolutions
      vps-user: intentsolutions
      smoke-validation: '.status == "ok"'
    secrets:
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
      VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}

  verify-release-refs:
    needs: [test, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.test.outputs.release-sha }}
          fetch-depth: 0
      - name: Verify release refs stayed unchanged during deployment
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.test.outputs.release-sha }}
          EXPECTED_RELEASE_TAG: ${{ needs.test.outputs.release-tag }}
          EXPECTED_TAG_OBJECT: ${{ needs.test.outputs.tag-object }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TAG_OBJECT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [ "$(git ls-remote origin "refs/tags/$EXPECTED_RELEASE_TAG" | cut -f1)" = "$EXPECTED_TAG_OBJECT" ]
          [ "$(git ls-remote origin "refs/tags/$EXPECTED_RELEASE_TAG^{}" | cut -f1)" = "$EXPECTED_RELEASE_SHA" ]
          # The tag must be byte-identical. Master may only have stayed put or
          # advanced to a newer source commit (superseded: the host may now
          # serve that commit, whose own serialised Release run re-deploys and
          # verifies it). Rewritten history or stray release commits fail.
          CLASS=$(scripts/blog/release-supersede-check.sh "$EXPECTED_RELEASE_SHA")
          case "$(printf '%s\n' "$CLASS" | sed -n 's/^state=//p')" in
            current) echo "Released master/tag refs stayed unchanged; host/public verification remains separate." ;;
            superseded)
              NEWER=$(printf '%s\n' "$CLASS" | sed -n 's/^newer=//p')
              echo "::notice title=Deploy superseded::master advanced to $NEWER during deployment of $EXPECTED_RELEASE_TAG; its Release run deploys and verifies it."
              ;;
            *) echo "master is not the released commit or a newer source commit" >&2; exit 1 ;;
          esac
