[build]
  command = "git submodule update --init --recursive && hugo --buildFuture --gc --minify --cleanDestinationDir && (npx -y pagefind@latest --site public || echo 'pagefind index skipped')"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.150.0"
  HUGO_ENABLEGITINFO = "true"
  HUGO_ENV = "production"
  NODE_VERSION = "18"
  TZ = "America/Chicago"

# The default Netlify host is a duplicate of the canonical site (it served 200
# with the tracker as of 2026-10-03). Send it to the apex. Host-scoped, so it
# does not touch deploy-preview-* hosts or a DNS rollback that points
# startaitools.com / www at Netlify (those requests carry the custom host).
[[redirects]]
  from = "https://startaitools.netlify.app/*"
  to = "https://startaitools.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://startaitools.com/*"
  to = "https://startaitools.com/:splat"
  status = 301
  force = true

# Cache control headers to prevent stale content
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/posts/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/about/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/research/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

